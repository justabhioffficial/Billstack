spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/billstackdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE;FILE_LOCK=SOCKET;DB_CLOSE_DELAY=-1}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 540000
      connection-timeout: 30000
      validation-timeout: 5000
      initialization-fail-timeout: 0
      keepalive-time: 30000
      connection-test-query: SELECT 1
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

logging:
  level:
    root: INFO
    com.billstack: DEBUG
    org.hibernate.SQL: WARN
