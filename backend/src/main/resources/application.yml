spring:
  application:
    name: billstack-api
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

billstack:
  jwt:
    secret: 9a6f8b12c4e5d6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  storage:
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_LOCAL_DIR:uploads}
    s3:
      endpoint: ${S3_ENDPOINT:https://s3.amazonaws.com}
      bucket: ${S3_BUCKET:billstack-receipts}
      access-key: ${S3_ACCESS_KEY:mock_access_key}
      secret-key: ${S3_SECRET_KEY:mock_secret_key}
      region: ${S3_REGION:ap-south-1}
  ocr:
    provider: ${OCR_PROVIDER:mock}
    api-key: ${OCR_API_KEY:mock_ocr_key}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_mockkey123}
    key-secret: ${RAZORPAY_KEY_SECRET:rzp_test_mocksecret123}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:whsec_mocksecret123}
  limits:
    free-plan-monthly-limit: 20
  email:
    provider: ${EMAIL_PROVIDER:mock}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
