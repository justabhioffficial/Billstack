<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BillStack — Turn bills into clean expense reports</title>
    <meta name="description" content="Upload receipts, automatically extract expense details, organize spending, and export tax-ready reports." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
      [id*="netlify"],
      [class*="netlify"],
      [data-netlify-feedback],
      [data-netlify-drawer],
      iframe[src*="netlify"],
      iframe[title*="Netlify"],
      .netlify-badge,
      #netlify-badge {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        left: -9999px !important;
      }
    </style>
    <script>
      (function() {
        const removeNetlifyBadge = function() {
          const els = document.querySelectorAll('[id*="netlify"], [class*="netlify"], [data-netlify-feedback], [data-netlify-drawer], iframe[src*="netlify"], iframe[title*="Netlify"], .netlify-badge, #netlify-badge');
          els.forEach(function(el) { el.remove(); });
        };
        if (typeof window !== 'undefined') {
          window.addEventListener('DOMContentLoaded', removeNetlifyBadge);
          const obs = new MutationObserver(removeNetlifyBadge);
          obs.observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-brand-100 selection:text-brand-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
